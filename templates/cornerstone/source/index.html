  <style>
    /* Cornerstone: an estate agent told around one house (docs/FILM-TEMPLATES.md). The story is
       drawn by xp-lib/xp-character.js from content.film; this page brings its cream and navy, its
       classic serif and the menu. Every colour, font and word comes from xp-content.js. */
    :root{
      --c-page:#f5f2ec;--c-surface:#ffffff;--c-text:#14213d;--c-muted:#6b7280;--c-accent:#c08b5c;--c-dark:#14213d;--c-onDark:#f5f2ec;--c-line:#e4ddd1;
      --f-display:"Playfair Display";--f-body:"Plus Jakarta Sans";
      --bg:var(--c-page);--surface:var(--c-surface);--ink:var(--c-text);--mut:var(--c-muted);--line:var(--c-line);--acc:var(--c-accent);--onacc:var(--c-dark);
      --r:10px;--stage:#f5f2ec;--xp-ink:#14213d;--xp-ink2:#4a5372;
      --brand-case:none;
      --mark:polygon(50% 0,100% 44%,100% 100%,0 100%,0 44%);
    }
    /* the story, dressed classic: a serif at medium weight, small corners, plain white cards */
    .xp-track{--xp-tt:none;--xp-tw:600;--xp-tls:-.015em;--xp-tlh:1.06;--xp-ts:1.06;--xp-els:.24em;--xp-r:.9;--xp-card:rgba(255,255,255,.8)}
    .nav .brand{font-weight:700;letter-spacing:.02em;font-size:clamp(20px,2.2vw,28px)}
    .nav .brand i{width:20px;height:18px}
    .nav a.l{font-weight:500}
  </style>
</head>
