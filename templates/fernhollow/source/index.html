<!doctype html>
<html lang="en" data-nav="mini" data-foot="line">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernhollow</title>
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <script src="./xp-content.js"></script>
  <link rel="stylesheet" href="./film-shell.css">
  <style>
    /* Fernhollow: a night studio told around one growing thing (docs/FILM-TEMPLATES.md). The story
       is drawn by xp-lib/xp-character.js from content.film; this page brings its black, its
       condensed capitals and the menu. Every colour, font and word comes from xp-content.js. */
    :root{
      --c-text:#f5efe2;--c-buttonText:#151510;--c-background:#040708;--c-panel:#0b0d0b;
      --f-display:"Antonio";--f-body:"Manrope";
      --bg:var(--c-background);--surface:var(--c-panel);--ink:var(--c-text);--mut:color-mix(in oklab,var(--c-text) 62%,var(--c-background));--line:color-mix(in oklab,var(--c-text) 16%,transparent);--acc:var(--c-text);--onacc:var(--c-buttonText);
      --r:20px;--stage:#040708;--xp-ink:#f5efe2;--xp-ink2:#b9b4a6;
      --brand-case:uppercase;
      --mark:polygon(50% 0,100% 40%,78% 52%,100% 70%,54% 100%,54% 60%,50% 62%,46% 60%,46% 100%,0 70%,22% 52%,0 40%);
    }
    /* the story, dressed for the night: tall capitals, long and light, glass the colour of moonlight */
    .xp-track{--xp-tt:uppercase;--xp-tw:600;--xp-tls:.004em;--xp-tlh:.94;--xp-ts:1.3;--xp-els:.32em;--xp-r:2;--xp-card:rgba(245,239,226,.06)}
    @media (max-width:760px){.xp-track{--xp-ts:1.08}}
    .nav .brand{font-weight:600;letter-spacing:.18em;font-size:clamp(16px,1.7vw,21px)}
    .nav .brand i{width:16px;height:20px}
    .nav a.l{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;font-weight:600}
  </style>
</head>
<body>
  <div id="xp-root"></div>
  <script src="./film-shell.js"></script>
</body>
</html>
