<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turntable</title>
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <script src="./xp-content.js"></script>
  <style>
    /* Turntable: a page written around one 3D model (Site Builder, docs/FILM.md).
       The story itself, the camera, the chips and the cards are drawn by xp-lib/xp-character.js
       from content.film into [data-xp-film-track]; this page brings the menu, the footer and the
       colours. Every colour, font and word comes from xp-content.js. */
    :root{
      --c-page:#0a0a0d;--c-surface:#14141a;--c-surface2:#1c1c24;--c-ink:#f4f4f7;--c-muted:#a4a4b0;--c-line:#26262e;
      --c-accent:#b57bff;--c-accent2:#5fe0d0;--c-onAccent:#0a0a0d;
      --f-display:"Big Shoulders Display";--f-body:"Manrope";--n-radius:16;
      --r:calc(var(--n-radius) * 1px);--ease:cubic-bezier(.22,1,.36,1);
      --xp-ink:var(--c-ink);--xp-ink2:var(--c-muted);--stage:#0b0b0f;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--c-page);color:var(--c-ink);font:400 16px/1.6 var(--f-body),ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit}
    h1,h2,h3{font-family:var(--f-display),var(--f-body),ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1;margin:0;text-transform:uppercase}
    p{margin:0}
    .wrap{width:min(1200px,100% - 40px);margin-inline:auto}

    /* ---------- the menu: over the story, following its tone ---------- */
    .nav{position:fixed;inset:0 0 auto;z-index:50;color:var(--xp-ink);transition:background-color .3s ease,backdrop-filter .3s ease,border-color .3s ease;border-bottom:1px solid transparent}
    .nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;min-height:64px;width:min(1320px,100% - 36px)}
    .nav .links{display:flex;gap:clamp(16px,2.2vw,32px);align-items:center}
    .nav a.l{font-size:14px;font-weight:500;text-decoration:none;opacity:.8;transition:opacity .2s}
    .nav a.l:hover{opacity:1}
    .nav .brand{justify-self:center;display:flex;align-items:center;gap:10px;font:700 clamp(18px,2vw,24px)/1 var(--f-display),var(--f-body),system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
    .nav .brand i{width:14px;height:22px;background:currentColor;clip-path:polygon(60% 0,0 58%,42% 58%,30% 100%,100% 38%,56% 38%)}
    .nav .right{display:flex;justify-content:flex-end;align-items:center;gap:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:999px;font:600 14px/1 var(--f-body),system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap;border:1px solid color-mix(in oklab,currentColor 40%,transparent);transition:background-color .2s ease,color .2s ease,transform .18s var(--ease)}
    .btn:active{transform:scale(.97)}
    .btn:hover{background:color-mix(in oklab,currentColor 12%,transparent)}
    .nav.solid{background:color-mix(in oklab,var(--c-page) 78%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom-color:var(--c-line)}
    @media (max-width:760px){
      .nav .wrap{grid-template-columns:1fr auto}
      .nav .links{display:none}
      .nav .brand{justify-self:start}
    }

    /* ---------- the story's place, and what shows before it is drawn ---------- */
    .film-host{min-height:100svh;background:var(--stage)}
    .film-host:has(.xp-track){min-height:0}
    .plain{position:relative;min-height:100svh;display:grid;align-items:center;padding:110px 0 70px;background:var(--stage);color:var(--xp-ink);overflow:hidden}
    .plain .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
    .plain h1{font-size:clamp(52px,8vw,120px)}
    .plain p{margin-top:18px;max-width:28em;font-size:clamp(16px,1.4vw,20px);color:var(--xp-ink2)}
    .plain .row{margin-top:26px}
    .plain .btn{background:var(--xp-ink);color:var(--c-page);border-color:transparent}
    .plain .xp-slot{position:relative;display:block;aspect-ratio:4/3;width:100%}
    .plain .xp-slot>img.xp-char-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    @media (max-width:880px){.plain .wrap{grid-template-columns:1fr}.plain .xp-slot{order:-1}}

    .extras:empty{display:none}
    footer.foot{padding:40px 0 52px;border-top:1px solid var(--c-line);color:var(--c-muted);font-size:14px;background:var(--c-page)}
    footer.foot .wrap{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:center}
    footer.foot .brand{font:700 20px/1 var(--f-display),system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink);text-decoration:none;margin-right:auto}
    footer.foot nav{display:flex;flex-wrap:wrap;gap:18px}
    footer.foot a{text-decoration:none}
    footer.foot a:hover{color:var(--c-ink)}
  </style>
</head>
<body>
  <div id="xp-root"></div>
  <script>
    (() => {
      // ---------- Content (xp-content.js) ----------
      const read = () => window.__XP_HASH__ || window.__XP__ || {};
      const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      let D = read();
      const fill = (s) => String(s == null ? "" : s).replace(/\{name\}/g, (D.brand && D.brand.name) || "").replace(/\{year\}/g, String(new Date().getFullYear()));
      const esc = (s) => fill(s).replace(/[&<>"']/g, (c) => ESC[c]);
      const href = (h) => { const v = String(h || "").trim(); return /^(https?:|mailto:|tel:|#|\/|\.\/)/i.test(v) ? v : ""; };
      const url = (u) => { const v = String(u || "").trim(); return /^(https:|data:image\/|\.\/|\/)/i.test(v) ? v : ""; };
      const model = (u) => { const v = String(u || "").trim(); return /^(https:|data:(model\/gltf-binary|application\/octet-stream);base64,|\.\/|\/)/i.test(v) ? v : ""; };
      const hasChar = () => !!model(D.character && D.character.src);
      const storyOn = () => hasChar() && !(D.film && D.film.on === false);
      const HEX = /^#[0-9a-f]{6}$/i;
      const mixc = (a, b, p) => `color-mix(in oklab, ${a} ${p}%, ${b})`;

      // The stage's tone follows the character's gradient: light words on a dark one, dark on a light one.
      const lumOf = (h) => HEX.test(h || "") ? [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)).reduce((a, c, i) => a + c * [0.2126, 0.7152, 0.0722][i], 0) : 0;
      const stops = () => { const st = (D.design && Array.isArray(D.design.stops)) ? D.design.stops : []; return [st[0] || "#0b0b0f", st[1] || st[0] || "#9aa3b5", st[2] || st[0] || "#22232b"]; };
      const stageDark = () => { const s = stops(); return lumOf(s[0]) * 0.8 + lumOf(s[2]) * 0.2 < 0.179; };
      const stageVars = () => {
        const s = stops(), dk = stageDark();
        return { "--stage": s[0], "--xp-ink": dk ? mixc(s[0], "#ffffff", 5) : mixc(s[0], "#0c0c11", 12), "--xp-ink2": dk ? mixc(s[0], "#e7e5f0", 24) : mixc(s[0], "#3a3a46", 24) };
      };

      const fonts = new Set();
      function theme() {
        const t = D.theme || {}, root = document.documentElement;
        for (const [k, v] of Object.entries(t.colors || {})) if (HEX.test(String(v))) root.style.setProperty("--c-" + k, String(v));
        for (const [k, v] of Object.entries(t.fonts || {})) {
          const f = String(v);
          if (!/^[A-Za-z0-9 ]{2,40}$/.test(f)) continue;
          root.style.setProperty("--f-" + k, '"' + f + '"');
          if (!fonts.has(f)) {
            fonts.add(f);
            const l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + ":wght@400;500;600;700&display=swap";
            document.head.appendChild(l);
          }
        }
        if (typeof t.radius === "number") root.style.setProperty("--n-radius", String(Math.max(0, Math.min(40, t.radius))));
        for (const [k, v] of Object.entries(stageVars())) root.style.setProperty(k, v);
        const page = (t.colors && t.colors.page) || "#0a0a0d";
        root.style.colorScheme = lumOf(page) < 0.2 ? "dark" : "light";
        document.title = fill((D.seo && D.seo.title) || (D.brand && D.brand.name));
        const desc = fill(D.seo && D.seo.description);
        for (const sel of ['meta[name="description"]', 'meta[property="og:description"]']) document.querySelector(sel).setAttribute("content", desc);
        document.querySelector('meta[property="og:title"]').setAttribute("content", document.title);
      }

      const charSlot = () => hasChar() ? `<div class="xp-slot" data-xp-character="hero" role="img" aria-label="${esc((D.character && D.character.name) || "3D character")}">${url(D.character.poster) ? `<img class="xp-char-poster" src="${esc(url(D.character.poster))}" alt="" draggable="false">` : ""}</div>` : "";

      function markup() {
        const nav = D.nav || {}, f = D.film || {}, h = f.hero || {}, ft = D.footer || {};
        const links = (Array.isArray(nav.links) ? nav.links : []).filter((l) => l && l.label);
        const mail = String(ft.email || "").trim();
        const lines = fill(h.title || (D.brand && D.brand.name) || "").split(/\n+/).filter(Boolean);
        const cta = nav.cta && fill(nav.cta).trim() ? `<a class="btn" href="${esc(href(nav.ctaHref) || "#")}">${esc(nav.cta)}</a>` : "";
        // The story is drawn into the empty place; without a character (or with the story off) the page
        // still opens with a plain headline.
        const opening = storyOn()
          ? `<div class="film-host" data-xp-film-track></div>`
          : `<section class="plain"><div class="wrap"><div><h1>${lines.map((l) => `<span style="display:block">${esc(l)}</span>`).join("")}</h1>${h.text ? `<p>${esc(h.text)}</p>` : ""}${h.cta ? `<div class="row"><a class="btn" href="${esc(href(h.ctaHref) || "#")}">${esc(h.cta)}</a></div>` : ""}</div>${charSlot()}</div></section>`;
        return `
        <header class="nav" id="top-nav"><div class="wrap">
          <nav class="links" aria-label="Main">${links.map((l) => `<a class="l" href="${esc(href(l.href) || "#")}">${esc(l.label)}</a>`).join("")}</nav>
          <a class="brand" href="#top"><i aria-hidden="true"></i>${esc(D.brand && D.brand.name)}</a>
          <div class="right">${cta}</div>
        </div></header>
        <main id="top">
          ${opening}
          <div class="extras" data-xp-extras></div>
        </main>
        <footer class="foot" id="contact" data-xp-noshot><div class="wrap">
          <a class="brand" href="#top">${esc(D.brand && D.brand.name)}</a>
          <nav aria-label="Footer">${links.map((l) => `<a href="${esc(href(l.href) || "#")}">${esc(l.label)}</a>`).join("")}${mail ? `<a href="mailto:${esc(mail)}">${esc(mail)}</a>` : ""}</nav>
          <span>${esc(ft.note)}</span>
        </div></footer>`;
      }

      // ---------- Motion: the menu turns solid once the story is over ----------
      function start() {
        const nav = document.getElementById("top-nav");
        const onScroll = () => {
          const host = document.querySelector(".xp-track");
          const end = host ? host.getBoundingClientRect().bottom : 0;
          nav.classList.toggle("solid", !host ? scrollY > 40 : end < 80);
        };
        onScroll();
        addEventListener("scroll", onScroll, { passive: true });
        return () => removeEventListener("scroll", onScroll);
      }

      // ---------- Mount, and redraw when the builder sends new content ----------
      const root = document.getElementById("xp-root");
      let stop = null;
      function mount() {
        const y = scrollY;
        if (stop) stop();
        theme();
        root.innerHTML = markup();
        stop = start();
        scrollTo(0, y);
      }
      mount();
      if (window.__XP_PREVIEW__) {
        addEventListener("message", (e) => {
          if (e.source !== parent || !e.data || e.data.type !== "xp-data") return;
          const next = JSON.stringify(e.data.data || {});
          if (next === JSON.stringify(D)) return;
          D = JSON.parse(next);
          mount();
        });
        parent.postMessage({ type: "xp-ready" }, "*");
      }
    })();
  </script>
</body>
</html>
