<!doctype html>
<html lang="en" data-nav="bar" data-foot="line">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit</title>
  <meta name="description" content="">
  <meta property="og:title" content="">

  <meta property="og:type" content="website">
  <script src="./xp-content.js"></script>
  <link rel="stylesheet" href="./film-shell.css">
  <style>
    /* Orbit: the builder's blank, character-first canvas, told around one small astronaut
       (docs/FILM-TEMPLATES.md). The story is drawn by xp-lib/xp-character.js from content.film; this
       page brings its night violet, its round display face and the menu. Every colour, font and
       word comes from xp-content.js. */
    :root{
      --c-page:#0d0b17;--c-surface:#161327;--c-surface2:#1f1b36;--c-ink:#f4f1ff;--c-muted:#aaa3c7;--c-line:#2b2645;--c-accent:#8b6cff;--c-accent2:#4fd1c5;--c-onAccent:#0d0b17;
      --f-display:"Unbounded";--f-body:"Manrope";
      --bg:var(--c-page);--surface:var(--c-surface);--ink:var(--c-ink);--mut:var(--c-muted);--line:var(--c-line);--acc:var(--c-accent);--onacc:var(--c-onAccent);
      --r:18px;--stage:#0d0b17;--xp-ink:#f4f1ff;--xp-ink2:#aaa3c7;
      --brand-case:none;
      --mark:circle(50% at 50% 50%);
    }
    /* the story, dressed for the night: a wide round face at medium weight, soft glass */
    .xp-track{--xp-tt:none;--xp-tw:500;--xp-tls:-.035em;--xp-tlh:1.04;--xp-ts:.74;--xp-els:.2em;--xp-r:1.6;--xp-card:rgba(139,108,255,.1)}
    .nav .brand{font-weight:600;letter-spacing:-.02em;font-size:clamp(17px,1.8vw,21px)}
    .nav .brand i{width:20px;height:20px;background:conic-gradient(from 210deg,var(--c-accent),var(--c-accent2),var(--c-accent))}
  </style>
</head>
<body>
  <div id="xp-root"></div>
  <script src="./film-shell.js"></script>
</body>
