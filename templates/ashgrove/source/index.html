    /* Ashgrove: a firelit kitchen told around one plate (docs/FILM-TEMPLATES.md). The story is
       drawn by xp-lib/xp-character.js from content.film; this page brings its colours, its serif
       headlines and the menu. Every colour, font and word comes from xp-content.js. */
    :root{
      --c-page:#14100d;--c-surface:#1e1814;--c-text:#f1e6d6;--c-muted:#a8977f;--c-accent:#e2833b;--c-glow:#ffb067;--c-line:#3a2f27;--c-onAccent:#14100d;

      --r:14px;--stage:#14100d;--xp-ink:#f1e6d6;--xp-ink2:#b9a88f;
      --brand-case:none;
      --mark:polygon(50% 0,68% 24%,86% 52%,80% 86%,50% 100%,20% 86%,14% 52%,32% 30%,40% 52%,50% 30%);
    }
    /* the story, dressed warm: a soft serif at ease, round corners, glass the colour of firelight */
