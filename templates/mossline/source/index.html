<!doctype html>
<html lang="en" data-nav="split" data-foot="cols">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mossline</title>
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <script src="./xp-content.js"></script>
  <link rel="stylesheet" href="./film-shell.css">
  <style>
    /* Mossline: a climate-data company told around one stand of trees (docs/FILM-TEMPLATES.md). The
       story is drawn by xp-lib/xp-character.js from content.film; this page brings its mist and
       forest green, its lime accent, its monospace labels and the menu. Every colour, font and
       word comes from xp-content.js. */
    :root{
      --c-ink:#10291a;--c-ink2:#2c4434;--c-mist:#e7ebe8;--c-paper:#ffffff;--c-accent:#c6f35c;--c-accent2:#a9dd3a;--c-positive:#4f8a12;--c-deep:#1b3122;
      --f-sans:"Inter Tight";--f-mono:"JetBrains Mono";
      --f-display:var(--f-sans);--f-body:var(--f-sans);
      --bg:var(--c-mist);--surface:var(--c-paper);--ink:var(--c-ink);--mut:var(--c-ink2);--line:color-mix(in oklab,var(--c-ink) 14%,transparent);--acc:var(--c-accent);--onacc:var(--c-ink);
      --r:12px;--stage:#e7ebe8;--xp-ink:#10291a;--xp-ink2:#2c4434;
      --brand-case:none;
      --mark:polygon(50% 0,92% 26%,92% 74%,50% 100%,8% 74%,8% 26%);
    }
    /* the story, dressed in field notes: tight grotesque headlines, monospace labels, glass the colour of mist */
    .xp-track{--xp-tt:none;--xp-tw:600;--xp-tls:-.035em;--xp-tlh:.98;--xp-ts:1.08;--xp-els:.18em;--xp-r:1;--xp-card:rgba(255,255,255,.62)}
    .xp-track .xp-eyebrow,.xp-track .xp-stat .lb,.xp-track .xp-plan .pr small,.xp-track .xp-fact .tx i,.xp-track .xp-step .no{font-family:var(--f-mono),ui-monospace,SFMono-Regular,Menlo,monospace}
    .nav .brand{font-weight:600;letter-spacing:-.02em;font-size:clamp(19px,2vw,24px)}
    .nav .brand i{width:18px;height:18px}
    .nav a.l{font-family:var(--f-mono),ui-monospace,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
  </style>
</head>
<body>
  <div id="xp-root"></div>
  <script src="./film-shell.js"></script>
</body>
</html>
