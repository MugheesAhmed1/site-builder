<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mossline</title>
  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Words, pictures, video, links, colours, fonts, sections and motion: edit xp-content.js -->
  <script src="./xp-content.js"></script>
  <style>
    :root{
      --c-ink:#10291a;
      --c-ink2:#2c4434;
      --c-mist:#e7ebe8;
      --c-paper:#ffffff;
      --c-accent:#c6f35c;
      --c-accent2:#a9dd3a;
      --c-positive:#4f8a12;
      --c-deep:#1b3122;
      --f-sans:"Inter Tight";
      --f-mono:"JetBrains Mono";
      --n-radius:12;
      --ink:var(--c-ink);
      --ink2:var(--c-ink2);
      --mist:var(--c-mist);
      --lime:var(--c-accent);
      --lime2:var(--c-accent2);
      --sans:var(--f-sans),"Helvetica Neue",Arial,sans-serif;
      --mono:var(--f-mono),ui-monospace,Menlo,monospace;
      --r:calc(var(--n-radius) * 1px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--mist)}
    body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    a:focus-visible,button:focus-visible{outline:2px solid var(--lime2);outline-offset:3px}

    .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
    .chip{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 9px;background:var(--lime);color:var(--ink);border-radius:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}

    /* Navigation */
    nav{position:fixed;top:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 34px}
    .logo{justify-self:start;display:inline-flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:600;font-size:21px;letter-spacing:-.02em}
    .logo svg{width:26px;height:26px;display:block}
    .menu{justify-self:center;display:flex;gap:30px}
    .menu a{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;transition:color .25s}
    .menu a:hover{color:var(--lime2)}
    .menu .chev{width:6px;height:6px;border-right:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:translateY(-2px) rotate(45deg)}
    .talk{justify-self:end;display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
    .talk .sq{width:20px;height:20px;background:var(--lime);color:var(--ink);border-radius:3px;display:grid;place-items:center;font-family:var(--sans);font-size:15px;line-height:1;transition:transform .3s}
    .talk:hover .sq{transform:translateX(3px)}

    /* Scroll story */
    #story{position:relative;height:640vh}
    .stage{position:sticky;top:0;height:100vh;overflow:hidden;background:color-mix(in srgb,var(--mist) 92%,#000)}
    .cam{position:absolute;inset:-9% -3% -3%;will-change:transform}
    #cv{width:100%;height:100%;display:block}
    .plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .mist{position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(40% 30% at 20% 80%, rgba(255,255,255,.55), transparent 70%),radial-gradient(35% 25% at 85% 30%, rgba(255,255,255,.4), transparent 70%);animation:drift 18s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(4%,-2%,0)}}
    #push{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}

    /* Front cut-out */
    .camF{pointer-events:none;visibility:hidden;-webkit-mask-image:linear-gradient(90deg, transparent 25%, #000 27.5%, #000 71.5%, transparent 74%);mask-image:linear-gradient(90deg, transparent 25%, #000 27.5%, #000 71.5%, transparent 74%)}
    .camF img{width:100%;height:100%;object-fit:cover;display:block}

    /* Fog bank */
    .fog{position:absolute;left:-8vw;top:-6vh;width:56vw;height:60vh;pointer-events:none;visibility:hidden;opacity:0;will-change:transform,opacity;-webkit-mask-image:radial-gradient(ellipse 52% 48% at 46% 46%, #000 44%, rgba(0,0,0,.7) 64%, transparent 100%);mask-image:radial-gradient(ellipse 52% 48% at 46% 46%, #000 44%, rgba(0,0,0,.7) 64%, transparent 100%)}
    .fog .f0{position:absolute;inset:0;background:radial-gradient(60% 55% at 40% 45%, #d9dddd, #cfd4d4 60%, #c9cfcf);filter:blur(10px)}
    .fog .f1{position:absolute;inset:-20%;opacity:.55;filter:blur(14px);animation:fogA 26s ease-in-out infinite alternate;background-size:cover;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='460'><filter id='n1'><feTurbulence type='fractalNoise' baseFrequency='0.006 0.014' numOctaves='3' seed='4'/><feColorMatrix type='matrix' values='0 0 0 0 .74  0 0 0 0 .78  0 0 0 0 .79  1.4 0 0 0 -.7'/></filter><rect width='100%25' height='100%25' filter='url(%23n1)'/></svg>")}
    .fog .f2{position:absolute;inset:-20%;opacity:.9;filter:blur(8px);animation:fogB 19s ease-in-out infinite alternate;background-size:cover;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='460'><filter id='n2'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.009' numOctaves='4' seed='11'/><feColorMatrix type='matrix' values='0 0 0 0 .9  0 0 0 0 .92  0 0 0 0 .92  1.6 0 0 0 -.55'/></filter><rect width='100%25' height='100%25' filter='url(%23n2)'/></svg>")}
    @keyframes fogA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6%,3%,0) scale(1.08)}}
    @keyframes fogB{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-7%,-2%,0) scale(1.12)}}

    /* Floating rocks */
    .rock{position:absolute;overflow:hidden;pointer-events:none;will-change:transform,filter}
    .rock .bob{position:absolute;inset:0;animation:bob 7s ease-in-out infinite alternate}
    .rock img{position:absolute;max-width:none;height:auto;display:block}
    .rock.whole img{inset:0;width:100%;height:100%;object-fit:contain}
    .rk1{left:4%;top:13%;width:7.5vw;aspect-ratio:260/295}
    .rk1 .bob{animation-duration:6s}
    .rk1:not(.whole) img{width:461.53846%;left:-11.53846%;top:-67.79661%}
    .rk3{left:80%;top:58%;width:14vw;aspect-ratio:265/270}
    .rk3 .bob{animation-duration:8.5s;animation-delay:-3s}
    .rk3:not(.whole) img{width:452.83019%;left:-337.73585%;top:-88.88889%}
    @keyframes bob{from{transform:translateY(-1.2%) rotate(-1.2deg)}to{transform:translateY(1.6%) rotate(1.4deg)}}

    /* Layers */
    .layer{position:absolute;inset:0;pointer-events:none}
    .layer>*{pointer-events:auto}

    /* L0 Hero headline */
    .hero-copy{position:absolute;left:0;right:0;top:12.5vh;text-align:center;will-change:transform,filter,opacity}
    .hero-copy h1{font-weight:500;font-size:clamp(44px,6vw,96px);line-height:.92;letter-spacing:-.045em;margin-top:18px;color:var(--ink)}
    .hero-copy .line{display:block;overflow:hidden;padding-bottom:.06em;white-space:nowrap}
    .hero-copy .line span{display:inline-block;transform:translateY(105%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{to{transform:none}}

    /* L1 HUD, caption, scroll hint */
    .hud{position:absolute;left:53.5%;top:62%;will-change:transform,opacity}
    .xhair{position:absolute;left:-44px;top:4px;width:22px;height:22px}
    .xhair::before,.xhair::after{content:"";position:absolute;background:#fff}
    .xhair::before{left:0;top:50%;width:22px;height:1px}
    .xhair::after{top:0;left:50%;width:1px;height:22px}
    .hud pre{font-family:var(--mono);font-size:11px;letter-spacing:.12em;line-height:1.65;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);margin-top:12px}
    .corners{position:absolute;left:-8px;top:-8px;right:-14px;bottom:-10px;border:1px solid rgba(255,255,255,.55);pointer-events:none;clip-path:polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, 14px 14px, 14px 0, calc(100% - 14px) 0, calc(100% - 14px) 14px, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 14px calc(100% - 14px), 0 calc(100% - 14px), 0 14px, 14px 14px)}

    .cap{position:absolute;left:34px;bottom:34px;padding-left:16px;border-left:2px solid var(--lime);font-family:var(--mono);font-size:11.5px;line-height:1.75;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
    .hint{position:absolute;right:34px;bottom:36px;display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
    .hint .circ{width:20px;height:20px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center}
    .hint .chev{width:5px;height:5px;border-right:1.3px solid currentColor;border-bottom:1.3px solid currentColor;transform:translateY(-1px) rotate(45deg);animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateY(-1px) rotate(45deg)}50%{transform:translateY(1px) rotate(45deg)}}

    /* L2 Vision */
    .L2{visibility:hidden}
    .vision{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,90vw);color:#fff;text-align:center}
    .vision h2{font-weight:500;font-size:clamp(34px,4.6vw,70px);line-height:1;letter-spacing:-.04em;margin:18px 0 20px;text-shadow:0 2px 40px rgba(10,30,15,.55),0 1px 3px rgba(10,30,15,.3)}
    .vision h2 .w{display:inline-block;will-change:transform,filter,opacity}
    .vision p{font-size:16px;line-height:1.45;text-shadow:0 1px 14px rgba(10,30,15,.7)}

    /* L3 Accounting & Hotspots */
    .L3{visibility:hidden}
    .acct{position:absolute;left:34px;top:14vh;width:min(560px,86vw);color:var(--ink);font-size:clamp(20px,1.9vw,29px);line-height:1.16;letter-spacing:-.02em;text-shadow:0 0 24px rgba(255,255,255,.8)}
    .acct .w{display:inline-block;will-change:filter,opacity}
    .hs{position:absolute;display:inline-flex;align-items:center;gap:10px;cursor:pointer;will-change:transform;margin-left:-11px;margin-top:-11px;transform-origin:11px 50%;border:0;background:none;font:inherit;color:inherit;text-align:left}
    .hs .dot{position:relative;width:22px;height:22px;border-radius:50%;background:var(--lime);flex:none;transition:transform .3s}
    .pulse .hs .dot{animation:ping 2.4s infinite}
    .hs .dot::before,.hs .dot::after{content:"";position:absolute;left:50%;top:50%;background:var(--ink);transform:translate(-50%,-50%)}
    .hs .dot::before{width:10px;height:1.4px}
    .hs .dot::after{width:1.4px;height:10px}
    .hs:hover .dot{transform:scale(1.15)}
    @keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 70%,transparent)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
    .hs .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:6px 9px;border-radius:4px;background:rgba(246,248,245,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .hs .lbl em{display:block;font-style:normal;color:var(--c-positive);max-height:0;overflow:hidden;transition:max-height .45s,margin-top .45s}
    .hs:hover .lbl em,.hs.on .lbl em{max-height:20px;margin-top:3px}

    /* L4 Station */
    .L4{visibility:hidden}
    .cred{position:absolute;left:34px;top:13vh;max-width:380px;color:var(--ink);font-size:clamp(22px,2vw,30px);line-height:1.08;letter-spacing:-.025em;text-shadow:0 0 24px rgba(255,255,255,.8);will-change:transform,filter,opacity}
    .cred .st-lbl{display:flex;width:max-content;background:var(--lime);color:var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:3px;margin-bottom:14px;text-shadow:none}
    .cred h3{font-weight:500;font-size:inherit;line-height:inherit;letter-spacing:inherit}

    .card{position:absolute;left:38%;top:38vh;width:250px;padding:18px;border-radius:calc(var(--r) * .85);background:color-mix(in srgb,var(--c-deep) 32%,transparent);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);color:#fff;will-change:transform,opacity}
    .card h4{font-size:15px;font-weight:500;line-height:1.15}
    .card .note{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:6px}
    .card .big{display:flex;align-items:baseline;gap:6px;margin-top:12px}
    .card .big .num{font-size:46px;font-weight:500;letter-spacing:-.04em;line-height:1}
    .card .big .unit{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .card .tag{position:absolute;right:16px;top:96px;background:var(--lime);color:var(--ink);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:3px}
    .card svg{display:block;width:100%;height:auto;margin-top:8px}
    .card .q{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:4px}

    .feats{position:absolute;right:34px;top:30vh;width:min(400px,36vw);padding:6px 16px;border-radius:calc(var(--r) * .85);background:rgba(246,248,245,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .feat{display:grid;grid-template-columns:30px 1fr 16px;gap:8px;align-items:center;width:100%;padding:11px 0;border:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:none;color:inherit;text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:color .3s,padding-left .3s}
    .feat:last-child{border-bottom:none}
    .feat .idx{opacity:.6}
    .feat .arr{transition:transform .3s}
    .feat:hover,.feat.on{color:var(--c-positive);padding-left:6px}
    .feat:hover .arr,.feat.on .arr{transform:translateX(4px)}

    /* Progress bar */
    .prog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:120px;height:2px;background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:2px;overflow:hidden;pointer-events:none}
    .prog .bar{width:100%;height:100%;background:var(--lime2);transform-origin:left center;transform:scaleX(0)}

    /* Solutions */
    .after{position:relative;z-index:5;margin-top:-30vh;background:var(--c-paper);border-radius:22px 22px 0 0;box-shadow:0 -30px 60px color-mix(in srgb,var(--ink) 12%,transparent)}
    #sol{padding:70px 34px 90px}
    .sol-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
    .sol-head h2{font-weight:500;font-size:clamp(34px,3.9vw,58px);line-height:1;letter-spacing:-.04em;max-width:640px;margin-top:20px}
    .sol-head p{font-size:15px;line-height:1.5;max-width:360px;color:color-mix(in srgb,var(--ink) 75%,var(--c-paper))}

    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:54px}
    .scard{position:relative;display:block;height:440px;border-radius:var(--r);overflow:hidden;background:var(--c-deep);color:#fff;transition:transform .25s ease-out;transform-style:preserve-3d}
    .scard .bg{position:absolute;inset:0;background-repeat:no-repeat;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
    .scard:hover .bg{transform:scale(1.07)}
    .scard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(10,25,15,.45), transparent 35%, transparent 55%, rgba(10,25,15,.75));pointer-events:none}
    .scard .top{position:absolute;top:18px;left:18px;right:18px;z-index:2;display:flex;justify-content:space-between;align-items:center}
    .scard .top .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
    .scard .go{width:28px;height:28px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:14px;transition:transform .4s}
    .scard:hover .go{transform:rotate(-45deg)}
    .scard .bot{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
    .scard .bot h3{font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
    .scard .bot p{font-size:13.5px;line-height:1.45;opacity:.88;max-height:0;overflow:hidden;margin-top:0;transition:max-height .6s,margin-top .6s}
    .scard:hover .bot p,.scard:focus-visible .bot p{max-height:80px;margin-top:10px}

    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;margin:60px 34px 0;border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
    #sol .stats{margin:60px 0 0}
    .stat{padding-top:22px}
    .stat .n{font-size:44px;font-weight:500;letter-spacing:-.04em;line-height:1}
    .stat .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 60%,var(--c-paper));margin-top:8px}

    /* Contact and footer */
    #contact{padding:90px 34px 60px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
    .ct{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
    .ct h2{font-weight:500;font-size:clamp(34px,4.4vw,64px);line-height:1;letter-spacing:-.04em;margin-top:20px}
    .ct p{font-size:15px;line-height:1.5;color:color-mix(in srgb,var(--ink) 75%,var(--c-paper));max-width:420px}
    .ct-actions{display:grid;gap:14px;justify-items:start}
    .btn{display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--c-paper);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    .btn .sq{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-family:var(--sans)}
    .ct-lines{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.9;color:var(--ink2)}
    footer{padding:28px 34px 40px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 55%,var(--c-paper))}

    @media (max-width:820px){
      nav{padding:16px 18px}
      .menu{display:none}
      .rk1{width:16vw}
      .rk3{width:30vw;top:70%}
      .hero-copy{top:12.5vh}
      .hero-copy .line{white-space:normal}
      .hero-copy h1{font-size:clamp(44px,6vw,96px)}
      .hud{left:50%;top:66%}
      .cap{left:18px;right:18px;bottom:70px}
      .hint{right:18px;bottom:24px}
      .cred{left:18px;top:11vh;max-width:80vw}
      .card{left:18px;top:auto;bottom:6vh;width:210px}
      .feats{right:18px;top:auto;bottom:6vh;width:45vw}
      .feat{font-size:9.5px;grid-template-columns:24px 1fr}
      .feat .arr{display:none}
      #sol{padding:50px 18px 70px}
      .scard{height:340px}
      .stats{margin:50px 18px 0}
      #contact{padding:60px 18px 40px}
      .ct{grid-template-columns:1fr}
      footer{padding:24px 18px 32px}
    }
    @media (prefers-reduced-motion:reduce){
      .mist,.fog .f1,.fog .f2,.rock .bob,.hint .chev,.hs .dot{animation:none!important}
      .hero-copy .line span{animation:none;transform:none}
    }
  </style>
</head>
<body>
  <div id="xp-root"></div>
  <script>
    (() => {
      // ---------- Content (xp-content.js) ----------
      const read = () => window.__XP_HASH__ || window.__XP__ || {};
      const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      let D = read();
      const fill = (s) => String(s == null ? "" : s).replace(/\{name\}/g, D.brand && D.brand.name || "").replace(/\{year\}/g, String(new Date().getFullYear()));
      const esc = (s) => fill(s).replace(/[&<>"']/g, (c) => ESC[c]);
      const br = (s) => esc(s).replace(/\n/g, "<br>");
      const href = (h) => { const v = String(h || "").trim(); return /^(https?:|mailto:|tel:|#|\/|\.\/)/i.test(v) ? v : ""; };
      const url = (u) => { const v = String(u || "").trim(); return /^(https:|data:image\/|data:video\/|\.\/|\/)/i.test(v) ? v : ""; };
      const cssUrl = (u) => url(u).replace(/["'()\\\s]/g, (c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"));
      const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);
      const on = (k) => !D.sections || D.sections[k] !== false;

        layoutHero(); sizeCv();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => alive && layoutHero());
        raf = requestAnimationFrame(frame);
        return () => { alive = false; cancelAnimationFrame(raf); off.forEach((f) => f()); if (vid) vid.pause(); };
      }

      // ---------- Mount, and redraw when the builder sends new content ----------
      const root = document.getElementById("xp-root");
      let stop = null;
      function mount() {
        const y = scrollY;
        if (stop) stop();
        theme();
        root.innerHTML = markup();
        stop = start();
        scrollTo(0, y);
      }
      mount();
      if (window.__XP_PREVIEW__) {
        addEventListener("message", (e) => {
          if (e.source !== parent || !e.data || e.data.type !== "xp-data") return;
          const next = JSON.stringify(e.data.data || {});
          if (next === JSON.stringify(D)) return;
          D = JSON.parse(next);
          mount();
        });
        parent.postMessage({ type: "xp-ready" }, "*");
      }
    })();
  </script>
</body>
</html>
