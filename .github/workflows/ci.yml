name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (also builds the ready-to-host site kit)
        run: npm run build
      # What ships (the builder and downloaded sites) must have no known high problems.
      - name: Dependencies with known problems
        run: npm audit --omit=dev --audit-level=high
      # Build and test tools are reported, not blocking: picomatch (inside vite and vitest) has a
      # high advisory with no fixed version yet (GHSA-fc5q-39xc-vjpf), and they only read this repo's own files.
      - name: Build tools with known problems (report only)
        run: npm audit --audit-level=high || true
